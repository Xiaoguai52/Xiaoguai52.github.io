<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Partner token exchange</title></head>
<body>
<p>Partner token exchange (client_credentials). Fill client_secret, then submit.</p>
<form action="https://auth.tesla.cn/oauth2/v3/token" method="POST">
<label>grant_type<input name="grant_type" value="client_credentials"></label><br>
<label>client_id<input name="client_id" value="37d53243-1801-4502-b643-ac3efd13e69c" size="40"></label><br>
<label>client_secret<input name="client_secret" value="" size="50"></label><br>
<label>audience<input name="audience" value="https://fleet-api.prd.cn.vn.cloud.tesla.cn" size="50"></label><br>
<label>scope<input name="scope" value="openid user_data vehicle_device_data vehicle_location vehicle_cmds vehicle_charging_cmds" size="80"></label><br>
<button type="submit">Submit</button>
</form>
<hr>
<p>Partner account registration</p>
<label>partner token <input id="ptoken" size="60"></label><br>
<button id="regbtn" type="button">Register partner account</button>
<pre id="regout"></pre>
<script>
document.getElementById('regbtn').addEventListener('click', async () => {
  const out = document.getElementById('regout');
  const tok = document.getElementById('ptoken').value.trim();
  out.textContent = 'sending...';
  try {
    const r = await fetch('https://fleet-api.prd.cn.vn.cloud.tesla.cn/api/1/partner_accounts', {method: 'POST', headers: {'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'}, body: JSON.stringify({domain: 'www.teslaxg.top'})});
    const t = await r.text();
    out.textContent = 'HTTP ' + r.status + ' ' + r.statusText + '\n' + t;
  } catch (e) {
    out.textContent = 'FETCH ERROR: ' + e.name + ': ' + e.message;
  }
});
</script>
</body></html>
