<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 照片墙 · 我们的现场</title>
<style>
  :root{ --violet:#c89bff; --violet-deep:#8b5cf6; --ink:#050508; --txt:#f2eefc; --dim:#9a93ad; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--ink);color:var(--txt);overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
  body{
    background:
      radial-gradient(110% 55% at 50% -8%, rgba(139,92,246,.30), transparent 60%),
      radial-gradient(70% 40% at 50% 108%, rgba(139,92,246,.20), transparent 65%),
      var(--ink);
    display:flex;flex-direction:column;align-items:center;min-height:100dvh;
    padding:26px 12px 30px;position:relative}
  /* starfield */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent 60%),
      radial-gradient(1px 1px at 32% 8%, #e9dcff, transparent 60%),
      radial-gradient(1.5px 1.5px at 58% 16%, #fff, transparent 60%),
      radial-gradient(1px 1px at 76% 30%, #e9dcff, transparent 60%),
      radial-gradient(1.5px 1.5px at 90% 12%, #fff, transparent 60%),
      radial-gradient(1px 1px at 44% 30%, #fff, transparent 60%),
      radial-gradient(1px 1px at 6% 44%, #e9dcff, transparent 60%),
      radial-gradient(1.5px 1.5px at 96% 48%, #fff, transparent 60%)}
  .kicker{font-size:11px;letter-spacing:.38em;color:var(--violet);text-transform:uppercase;text-align:center}
  h1{font-size:26px;font-weight:800;text-align:center;margin:11px 0 6px}
  .hint{text-align:center;color:var(--dim);font-size:12.5px}

  /* ---------- 3D STAGE ---------- */
  .stage{position:relative;width:100%;max-width:520px;height:400px;margin-top:6px;
    perspective:1500px;perspective-origin:50% 46%;touch-action:pan-y;cursor:grab}
  .stage:active{cursor:grabbing}
  .ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
  .panel{position:absolute;left:-90px;top:-135px;width:180px;height:270px;
    border-radius:16px;overflow:hidden;backface-visibility:hidden;
    border:1px solid rgba(255,255,255,.28);
    box-shadow:0 18px 44px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.35);
    background:#111}
  .panel img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .panel::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,.20) 0%, transparent 32%),
               linear-gradient(to top, rgba(0,0,0,.44), transparent 34%)}
  .panel .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;z-index:2;
    font-size:12px;letter-spacing:.06em;color:#fff;
    background:linear-gradient(to top, rgba(0,0,0,.55), transparent)}
  .panel .cap b{display:block;font-size:13.5px;margin-bottom:1px}
  .panel .cap span{color:#cfc6e6;font-size:11px}
  .floor{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    width:320px;height:40px;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(139,92,246,.38), transparent 70%)}

  /* ---------- FRONT CAPTION + CONTROLS ---------- */
  .front-cap{margin-top:2px;text-align:center;min-height:52px}
  .front-cap b{display:block;font-size:17px}
  .front-cap span{color:var(--dim);font-size:12.5px}
  .controls{display:flex;gap:10px;margin-top:10px}
  .controls button{appearance:none;border:1px solid rgba(200,155,255,.35);color:var(--txt);
    background:rgba(200,155,255,.08);border-radius:999px;padding:9px 18px;font-size:13px;cursor:pointer}
  .controls button:active{transform:scale(.96)}
  .foot{margin-top:22px;color:#5f5970;font-size:11.5px;line-height:1.7;text-align:center;padding:0 18px}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(3,3,8,.9);backdrop-filter:blur(6px);padding:22px}
  .lightbox.show{display:flex}
  .lightbox figure{max-width:min(92vw,430px);text-align:center;animation:zoom .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes zoom{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
  .lightbox img{width:100%;max-height:74dvh;object-fit:contain;border-radius:14px;
    box-shadow:0 0 60px rgba(139,92,246,.45);border:1px solid rgba(255,255,255,.25)}
  .lightbox figcaption{margin-top:14px;font-size:14px}
  .lightbox figcaption span{display:block;color:var(--dim);font-size:12px;margin-top:3px}
  .lightbox .closehint{margin-top:10px;color:#6d6580;font-size:11.5px}
</style>
</head>
<body>
  <div class="kicker">3D Photo Wall</div>
  <h1>我们的现场 · 立体照片墙</h1>
  <p class="hint">手指拖动旋转 · 点任意一张照片放大看</p>

  <div class="stage" id="stage">
    <div class="ring" id="ring"></div>
    <div class="floor"></div>
  </div>

  <div class="front-cap"><b id="frontTitle">—</b><span id="frontSub">—</span></div>
  <div class="controls">
    <button id="spinBtn">⏸ 暂停旋转</button>
    <button id="speedBtn">🐢 慢一点</button>
  </div>

  <p class="foot">3D 照片墙 · 样板（DEMO）<br>照片来自「我们的档案」（网页尺寸版）。转台可拖拽、带惯性，正面照片自动提亮，背面自动压暗；点照片进入大图。</p>

  <div class="lightbox" id="lightbox">
    <figure>
      <img id="lbImg" src="" alt="">
      <figcaption><b id="lbTitle"></b><span id="lbSub"></span></figcaption>
      <div class="closehint">点任意处关闭</div>
    </figure>
  </div>

<script>
(function(){
  var PHOTOS = [
    {src:'https://www.teslaxg.top/birthday/concert/img/concert-2023-06-25-1.jpg', t:'武汉 · 五月天现场', s:'2023.06.25 · 五环体育中心'},
    {src:'https://www.teslaxg.top/ourarchive/assets/concert-2023-06-25-2.jpg', t:'武汉 · 同一场', s:'2023.06.25 · 好好好想见到你'},
    {src:'https://www.teslaxg.top/birthday/concert/img/jj20-2023-12-09-1.jpg', t:'南宁 · JJ20', s:'2023.12.09 · 广西体育中心 · 林俊杰'},
    {src:'https://www.teslaxg.top/birthday/concert/img/graduation-2022-06-together.jpg', t:'毕业季', s:'2022.06 · 一起走出校门'},
    {src:'https://www.teslaxg.top/birthday/concert/img/laixinwen-confetti-2022.jpg', t:'彩带落下时', s:'2022 · 她在发光'},
    {src:'https://www.teslaxg.top/birthday/img/laixinwen-glasses.jpg', t:'眼镜杀', s:'赖大宝的经典造型'},
    {src:'https://www.teslaxg.top/birthday/img/laixinwen-2021-10-pink-night.jpg', t:'粉色之夜', s:'2021.10 · 他们的第一年'},
    {src:'https://www.teslaxg.top/birthday/img/laixinwen-field.jpg', t:'广角模式', s:'田野与天空 · 原图直出'},
    {src:'https://www.teslaxg.top/birthday/concert/img/cover.jpg', t:'天空的戒指', s:'日环食 · 午夜场的天幕'},
    {src:'https://www.teslaxg.top/ourarchive/assets/doudou-1.jpg', t:'猫哥哥 · 金豆豆', s:'家里的一员 · 蓝猫本猫'}
  ];
  var N = PHOTOS.length, STEP = 360 / N, RADIUS = 305;
  var ring = document.getElementById('ring');
  var stage = document.getElementById('stage');
  var panels = [];

  PHOTOS.forEach(function(p, i){
    var d = document.createElement('div');
    d.className = 'panel';
    d.dataset.idx = i;
    d.innerHTML = '<img src="'+p.src+'" alt="'+p.t+'">' +
      '<div class="cap"><b>'+p.t+'</b><span>'+p.s+'</span></div>';
    ring.appendChild(d);
    panels.push(d);
  });

  var angle = 0;              // ring rotation (deg)
  var velocity = 0;           // drag inertia
  var autoSpeed = 2.4;        // deg per second (slow)
  var spinning = true;
  var dragging = false, dragMoved = 0, lastX = 0, lastT = 0;
  var focusAnim = null;

  var frontTitle = document.getElementById('frontTitle');
  var frontSub = document.getElementById('frontSub');
  var lastFront = -1;

  function frontIndex(){
    // panel i faces front when angle + i*STEP == 0 (mod 360)
    var best = 0, bestDist = 1e9;
    for(var i=0;i<N;i++){
      var a = ((angle + i*STEP) % 360 + 360) % 360;
      var dist = Math.min(a, 360 - a);
      if(dist < bestDist){ bestDist = dist; best = i; }
    }
    return best;
  }

  function render(){
    ring.style.transform = 'rotateX(-6deg) rotateY(' + angle + 'deg)';
    for(var i=0;i<N;i++){
      var a = ((angle + i*STEP) % 360 + 360) % 360;      // 0 = front
      var facing = Math.cos(a * Math.PI / 180);          // 1 front, -1 back
      var bright = 0.45 + 0.55 * Math.max(0, facing);
      panels[i].style.transform =
        'rotateY(' + (i*STEP) + 'deg) translateZ(' + RADIUS + 'px)';
      panels[i].style.filter = 'brightness(' + bright.toFixed(2) + ')';
      panels[i].style.zIndex = Math.round(facing * 100);
    }
    var f = frontIndex();
    if(f !== lastFront){
      lastFront = f;
      frontTitle.textContent = PHOTOS[f].t;
      frontSub.textContent = PHOTOS[f].s;
    }
  }

  var prevT = performance.now();
  function loop(now){
    var dt = Math.min(64, now - prevT) / 1000; prevT = now;
    if(focusAnim){
      var k = Math.min(1, focusAnim.t + dt / focusAnim.dur);
      var e = 1 - Math.pow(1 - k, 3);
      angle = focusAnim.from + (focusAnim.to - focusAnim.from) * e;
      focusAnim.t += dt;
      if(k >= 1){ focusAnim = null; openLightbox(focusTarget); }
    } else if(!dragging){
      if(Math.abs(velocity) > 0.02){
        angle += velocity * dt * 60 * 0.12;
        velocity *= Math.pow(0.06, dt); // decay
      } else if(spinning){
        angle += autoSpeed * dt;
      }
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- drag to spin ---------- */
  stage.addEventListener('pointerdown', function(e){
    dragging = true; dragMoved = 0; lastX = e.clientX; lastT = performance.now();
    velocity = 0; focusAnim = null;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - lastX;
    dragMoved += Math.abs(dx);
    angle += dx * 0.28;
    var now = performance.now();
    var dt = Math.max(1, now - lastT);
    velocity = (dx / dt) * 16.7;
    lastX = e.clientX; lastT = now;
  });
  function endDrag(e){
    if(dragging && dragMoved > 8) suppressUntil = performance.now() + 350;
    dragging = false;
    // Tap detection lives here, not in a click listener: the stage's
    // pointer capture would swallow the panels' click events.
    if(e && dragMoved <= 8 && e.clientX !== undefined){
      var el = document.elementFromPoint(e.clientX, e.clientY);
      var panel = el && el.closest ? el.closest('.panel') : null;
      if(panel) onPanelTap(parseInt(panel.dataset.idx, 10));
    }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  /* ---------- tap a panel: rotate to front, then lightbox ---------- */
  var focusTarget = -1;
  var suppressUntil = 0;
  function onPanelTap(i){
    if(performance.now() < suppressUntil) return;   // the click trailed a drag
    if(i === frontIndex()){ openLightbox(i); return; }
    var current = ((angle % 360) + 360) % 360;
    var targetMod = ((-(i*STEP)) % 360 + 360) % 360;
    var delta = targetMod - current;
    if(delta > 180) delta -= 360;
    if(delta < -180) delta += 360;
    focusTarget = i;
    focusAnim = { from: angle, to: angle + delta, t: 0, dur: 0.7 };
  }

  /* ---------- lightbox ---------- */
  var lb = document.getElementById('lightbox');
  function openLightbox(i){
    document.getElementById('lbImg').src = PHOTOS[i].src;
    document.getElementById('lbTitle').textContent = PHOTOS[i].t;
    document.getElementById('lbSub').textContent = PHOTOS[i].s;
    lb.classList.add('show');
  }
  lb.addEventListener('click', function(){ lb.classList.remove('show'); });

  /* ---------- controls ---------- */
  var spinBtn = document.getElementById('spinBtn');
  spinBtn.addEventListener('click', function(){
    spinning = !spinning;
    spinBtn.textContent = spinning ? '⏸ 暂停旋转' : '▶️ 继续旋转';
  });
  var speeds = [2.4, 6, 12], speedIdx = 0;
  var speedBtn = document.getElementById('speedBtn');
  var speedNames = ['🐢 慢一点','🚶 快一点','🚀 再快点'];
  speedBtn.addEventListener('click', function(){
    speedIdx = (speedIdx + 1) % 3;
    autoSpeed = speeds[speedIdx];
    speedBtn.textContent = speedNames[speedIdx];
    if(!spinning){ spinning = true; spinBtn.textContent = '⏸ 暂停旋转'; }
  });

  render();
})();
</script>
</body>
</html>
