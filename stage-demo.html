<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JJ20 · 舞台模拟 — 沉浸式样板</title>
<style>
  :root{ --violet:#c89bff; --txt:#f2eefc; --dim:#9a93ad; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#040409;color:var(--txt);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
  canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    pointer-events:none;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
  .top{text-align:center}
  .kicker{font-size:10.5px;letter-spacing:.4em;color:var(--violet);text-transform:uppercase}
  .top h1{font-size:21px;font-weight:800;margin-top:7px;text-shadow:0 2px 18px rgba(0,0,0,.8)}
  .top p{color:var(--dim);font-size:11.5px;margin-top:5px;text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .bottom{pointer-events:auto}
  .now{text-align:center;margin-bottom:11px;text-shadow:0 2px 14px rgba(0,0,0,.85)}
  .now b{font-size:16px}
  .now span{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .btns{display:flex;gap:8px;justify-content:flex-start;overflow-x:auto;padding:2px 2px 6px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .btns::-webkit-scrollbar{display:none}
  .btns button{flex:0 0 auto;appearance:none;cursor:pointer;border-radius:999px;
    padding:10px 16px;font-size:13.5px;color:var(--txt);
    background:rgba(16,14,26,.72);border:1px solid rgba(200,155,255,.32);
    backdrop-filter:blur(8px);transition:all .25s}
  .btns button.on{border-color:var(--violet);background:rgba(139,92,246,.35);
    box-shadow:0 0 18px rgba(139,92,246,.45);color:#fff}
  .btns button.climax{border-color:rgba(255,183,222,.55)}
  .btns button.climax.on{background:rgba(190,90,160,.4);box-shadow:0 0 20px rgba(255,150,210,.5)}
  .foot{text-align:center;color:#5f5970;font-size:10.5px;margin-top:7px;line-height:1.6}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="ui">
  <div class="top">
    <div class="kicker">JJ20 · Stage Simulation</div>
    <h1>林俊杰演唱会 · 舞台模拟</h1>
    <p>2023.12.09 · 南宁 · 广西体育中心 — 那一晚的视角</p>
  </div>
  <div class="bottom">
    <div class="now"><b id="nowTitle">开场 · JJ20</b><span id="nowSub">紫海升起，激光交织——南宁那晚，全场还自发玩起了人浪</span></div>
    <div class="btns" id="btns">
      <button data-mode="open" class="on">🎤 开场</button>
      <button data-mode="jiangnan">🌧 江南</button>
      <button data-mode="millennium">✨ 一千年以后</button>
      <button data-mode="tasay">🌙 她说</button>
      <button data-mode="request">🎹 点歌</button>
      <button data-mode="story" class="climax">💜 将故事写成我们</button>
      <button id="confettiBtn">🎉 彩带</button>
    </div>
    <p class="foot">粉丝自制沉浸式模拟（非官方舞台复刻）· 大屏终幕照片 = 她在 JJ20 现场的原图<br>点不同歌曲，灯光与大屏会跟着换场。</p>
  </div>
</div>

<script>
(function(){
  var cv = document.getElementById('stage'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildSea();
  }
  window.addEventListener('resize', resize);

  /* ---------------- palettes / modes ---------------- */
  function rgb(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  function rgba(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function lerp(a, b, k){ return a + (b - a) * k; }
  function lerpC(c1, c2, k){
    return [lerp(c1[0], c2[0], k)|0, lerp(c1[1], c2[1], k)|0, lerp(c1[2], c2[2], k)|0];
  }
  var MODES = {
    open:      { beam:[[200,155,255],[255,255,255],[150,110,255]], sea:[[186,140,255],[220,190,255],[150,100,240]],
                 scrA:[64,32,120], scrB:[16,8,38], title:'JJ20', sub:'林俊杰 · JJ20 世界巡回', glow:[139,92,246], speed:1.0, wave:0.55, dim:1, lasers:1 },
    jiangnan:  { beam:[[120,180,255],[160,230,255],[110,140,255]], sea:[[140,170,255],[190,220,255],[120,140,250]],
                 scrA:[22,52,110], scrB:[6,14,40], title:'江 南', sub:'烟雨里的一把伞', glow:[80,130,255], speed:0.55, wave:0.35, dim:1 },
    millennium:{ beam:[[255,205,110],[255,170,80],[255,235,180]], sea:[[255,205,130],[220,170,255],[255,180,90]],
                 scrA:[110,70,20], scrB:[34,18,4], title:'一千年以后', sub:'因为在一千年以后 · 世界早已没有我', glow:[255,180,80], speed:0.8, wave:0.6, dim:1, lasers:1 },
    tasay:     { beam:[[255,190,215],[255,230,240],[230,180,255]], sea:[[255,190,215],[240,205,255],[255,215,230]],
                 scrA:[96,44,74], scrB:[26,10,24], title:'她 说', sub:'她静悄悄地来过', glow:[255,160,200], speed:0.45, wave:0.3, dim:1 },
    request:   { beam:[[150,170,255],[190,205,255],[130,150,240]], sea:[[150,130,230],[185,170,255],[130,110,220]],
                 scrA:[12,14,34], scrB:[4,5,12], title:'翅 膀', sub:'点歌环节 · 害怕', glow:[130,150,255], speed:0.4, wave:0.15, dim:0.12, piano:1, deckLights:0 },
    story:     { beam:[[216,150,255],[255,170,220],[170,120,255]], sea:[[205,150,255],[255,180,230],[170,120,255]],
                 scrA:[80,36,130], scrB:[20,8,44], title:'将故事写成我们', sub:'这一首 · 唱给赖大宝', glow:[190,120,255], speed:1.25, wave:1.0, dim:1, lasers:1, photo:true }
  };
  var cur = MODES.open, from = MODES.open, to = MODES.open, transT = 1;
  var modeKey = 'open';

  var photo = new Image();
  photo.crossOrigin = 'anonymous';
  var photoOK = false;
  photo.onload = function(){ photoOK = true; };
  photo.src = 'https://www.teslaxg.top/birthday/concert/img/jj20-2023-12-09-1.jpg';

  /* ---------------- light sea ---------------- */
  var sea = [];
  function buildSea(){
    sea = [];
    var rows = 9;
    for(var r = 0; r < rows; r++){
      var yBase = H * 0.76 + (H * 0.235) * (r / (rows - 1)) * (r / (rows - 1)) + r * 2;
      var per = Math.floor(W / (26 - r * 1.1));
      for(var i = 0; i < per; i++){
        sea.push({
          x: (i + 0.5) * (W / per) + (Math.random() - 0.5) * 9,
          y: yBase + (Math.random() - 0.5) * 5,
          r: r, ph: Math.random() * Math.PI * 2,
          ci: (Math.random() * 3) | 0, s: 0.7 + Math.random() * 0.7
        });
      }
    }
  }

  /* ---------------- confetti ---------------- */
  var confetti = [];
  function burst(n){
    var cols = [[200,155,255],[255,183,222],[255,255,255],[150,110,255],[233,213,255]];
    for(var i = 0; i < (n || 130); i++){
      confetti.push({
        x: Math.random() * W, y: -20 - Math.random() * H * 0.35,
        w: 5 + Math.random() * 5, h: 8 + Math.random() * 7,
        vy: 1.1 + Math.random() * 1.9, vx: (Math.random() - 0.5) * 0.7,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.16,
        c: cols[(Math.random() * cols.length) | 0], life: 1
      });
    }
  }

  /* ---------------- drawing helpers ---------------- */
  function mix(key){
    var a = from[key], b = to[key];
    if(Array.isArray(a[0])) return a.map(function(c, i){ return lerpC(c, b[i], transT); });
    return lerpC(a, b, transT);
  }
  function mixNum(key){ return lerp(from[key], to[key], transT); }

  function beam(x, y, ang, len, wid, color, alpha){
    var x2 = x + Math.sin(ang) * len, y2 = y + Math.cos(ang) * len;
    var px = Math.cos(ang) * wid, py = -Math.sin(ang) * wid;
    var g = ctx.createLinearGradient(x, y, x2, y2);
    g.addColorStop(0, rgba(color, alpha));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x2 + px, y2 + py);
    ctx.lineTo(x2 - px, y2 - py);
    ctx.closePath(); ctx.fill();
    // source glow
    var rg = ctx.createRadialGradient(x, y, 0, x, y, 26);
    rg.addColorStop(0, rgba(color, Math.min(1, alpha + 0.25)));
    rg.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
  }

  function rr(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------------- main loop ---------------- */
  var T0 = performance.now();
  function frame(now){
    var t = (now - T0) / 1000;
    if(transT < 1) transT = Math.min(1, transT + 0.016 / 1.1);
    var beamCols = mix('beam'), seaCols = mix('sea');
    var scrA = mix('scrA'), scrB = mix('scrB'), glow = mix('glow');
    var speed = mixNum('speed'), waveAmp = mixNum('wave'), dimNow = mixNum('dim');
    var laserAmt = to.lasers ? transT : 1 - transT;
    var pianoAmt = to.piano ? transT : 1 - transT;
    var deckAmt = (to.deckLights === 0) ? 1 - transT : transT;
    var isStory = modeKey === 'story';
    var usePhoto = isStory && photoOK;

    // backdrop
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#07060f'); bg.addColorStop(0.55, '#040409'); bg.addColorStop(1, '#020207');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    var cx = W / 2;
    var scrW = Math.min(W * 0.68, 580), scrH = scrW * 0.56;
    var scrX = cx - scrW / 2, scrY = H * 0.135;
    var deckY = scrY + scrH + H * 0.045;

    // ambient glow behind stage
    var amb = ctx.createRadialGradient(cx, scrY + scrH * 0.5, 10, cx, scrY + scrH * 0.5, scrW * 0.95);
    amb.addColorStop(0, rgba(glow, 0.30 * (0.35 + 0.65 * dimNow))); amb.addColorStop(1, rgba(glow, 0));
    ctx.fillStyle = amb; ctx.fillRect(0, 0, W, H * 0.8);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // tower beams (behind screen, from sides)
    var towerTopY = H * 0.10, towerBotY = deckY;
    [-1, 1].forEach(function(side){
      for(var i = 0; i < 3; i++){
        var fx = cx + side * (scrW * 0.72);
        var fy = towerTopY + i * (towerBotY - towerTopY) * 0.30;
        var ang = side * (0.5 + 0.22 * Math.sin(t * 0.6 * speed + i * 1.7 + (side > 0 ? 2 : 0)));
        beam(fx, fy, ang + Math.PI, H * 0.62, 34, beamCols[(i + (side > 0 ? 1 : 0)) % 3], 0.10 * dimNow);
      }
    });

    // top truss beams
    for(var j = 0; j < 6; j++){
      var bx = scrX + (j + 0.5) * (scrW / 6);
      var bang = Math.sin(t * 0.9 * speed + j * 1.13) * 0.55;
      beam(bx, scrY - 14, bang + Math.PI, H * 0.60, 26, beamCols[j % 3], 0.13 * dimNow);
    }
    ctx.restore();

    // lasers: pink-violet web crossing above the stage (JJ20 signature, per fan photos)
    if(laserAmt > 0.02){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var laserCols = [[240,171,252],[196,141,255]];
      [-1, 1].forEach(function(side, si){
        var lx0 = cx + side * scrW * 0.52, ly0 = scrY + scrH * 0.30;
        for(var li2 = 0; li2 < 4; li2++){
          var sweep = Math.sin(t * 0.7 * speed + li2 * 0.8 + si * 2.1) * 0.10;
          var la = -side * (0.62 + li2 * 0.16) + sweep;
          var llen = W * 0.85;
          var lx2 = lx0 + Math.sin(la) * llen, ly2 = ly0 - Math.cos(la) * llen * 0.55;
          ctx.strokeStyle = rgba(laserCols[li2 % 2], 0.05 * laserAmt);
          ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(lx0, ly0); ctx.lineTo(lx2, ly2); ctx.stroke();
          ctx.strokeStyle = rgba(laserCols[li2 % 2], 0.5 * laserAmt);
          ctx.lineWidth = 1.1;
          ctx.beginPath(); ctx.moveTo(lx0, ly0); ctx.lineTo(lx2, ly2); ctx.stroke();
        }
      });
      ctx.restore();
    }

    // side screens (angled quads)
    [-1, 1].forEach(function(side){
      var w2 = scrW * 0.30, h2 = scrH * 0.82;
      var x0 = cx + side * (scrW * 0.56), y0 = scrY + scrH * 0.10;
      var slant = scrH * 0.10;
      var g2 = ctx.createLinearGradient(x0, y0, x0, y0 + h2);
      g2.addColorStop(0, rgba(scrA, 0.85)); g2.addColorStop(1, rgba(scrB, 0.9));
      ctx.fillStyle = g2;
      ctx.beginPath();
      if(side < 0){ ctx.moveTo(x0, y0 + slant); ctx.lineTo(x0 + w2, y0); ctx.lineTo(x0 + w2, y0 + h2); ctx.lineTo(x0, y0 + h2 - slant); }
      else { ctx.moveTo(x0, y0); ctx.lineTo(x0 + w2, y0 + slant); ctx.lineTo(x0 + w2, y0 + h2 - slant); ctx.lineTo(x0, y0 + h2); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke();
    });

    // main screen
    ctx.save();
    rr(scrX, scrY, scrW, scrH, 12); ctx.clip();
    if(usePhoto){
      var pw = photo.width, ph = photo.height;
      var sc = Math.max(scrW / pw, scrH / ph);
      ctx.drawImage(photo, scrX + (scrW - pw * sc) / 2, scrY + (scrH - ph * sc) / 2, pw * sc, ph * sc);
      var vg = ctx.createLinearGradient(0, scrY, 0, scrY + scrH);
      vg.addColorStop(0, 'rgba(10,4,24,.12)'); vg.addColorStop(1, 'rgba(10,4,24,.45)');
      ctx.fillStyle = vg; ctx.fillRect(scrX, scrY, scrW, scrH);
    } else {
      var sg = ctx.createLinearGradient(0, scrY, 0, scrY + scrH);
      sg.addColorStop(0, rgb(scrA)); sg.addColorStop(1, rgb(scrB));
      ctx.fillStyle = sg; ctx.fillRect(scrX, scrY, scrW, scrH);
      // animated light waves on screen
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for(var wv = 0; wv < 3; wv++){
        ctx.beginPath();
        for(var x = 0; x <= scrW; x += 8){
          var y = scrY + scrH * (0.62 + wv * 0.1) + Math.sin(x * 0.02 + t * (1.1 + wv * 0.4) * speed + wv * 2) * 9;
          if(x === 0) ctx.moveTo(scrX + x, y); else ctx.lineTo(scrX + x, y);
        }
        ctx.strokeStyle = rgba(beamCols[wv % 3], 0.35);
        ctx.lineWidth = 2.2; ctx.stroke();
      }
      ctx.restore();
      // screen title
      ctx.fillStyle = 'rgba(255,255,255,.96)';
      ctx.textAlign = 'center';
      ctx.font = '800 ' + Math.round(scrH * 0.21) + 'px -apple-system, "PingFang SC", sans-serif';
      ctx.shadowColor = rgba(glow, 0.9); ctx.shadowBlur = 26;
      ctx.fillText(to.title, cx, scrY + scrH * 0.44);
      ctx.shadowBlur = 0;
      ctx.font = '500 ' + Math.round(scrH * 0.062) + 'px -apple-system, "PingFang SC", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.fillText(to.sub, cx, scrY + scrH * 0.60);
    }
    if(usePhoto){
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.textAlign = 'center';
      ctx.font = '700 ' + Math.round(scrH * 0.085) + 'px -apple-system, "PingFang SC", sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 12;
      ctx.fillText('将故事写成我们', cx, scrY + scrH * 0.90);
      ctx.shadowBlur = 0;
    }
    ctx.restore();
    rr(scrX, scrY, scrW, scrH, 12);
    ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 1.2; ctx.stroke();

    // truss bar + fixtures
    ctx.fillStyle = '#0b0b12';
    ctx.fillRect(scrX - 8, scrY - 22, scrW + 16, 9);
    for(var j2 = 0; j2 < 6; j2++){
      ctx.fillStyle = '#181824';
      ctx.fillRect(scrX + (j2 + 0.5) * (scrW / 6) - 5, scrY - 20, 10, 12);
    }
    // towers
    [-1, 1].forEach(function(side){
      var tx = cx + side * (scrW * 0.72) - 3;
      ctx.fillStyle = '#0b0b12';
      ctx.fillRect(tx, H * 0.10, 6, deckY - H * 0.10);
    });

    // stage deck (trapezoid) + glowing front edge
    var deckW = scrW * 1.24;
    ctx.beginPath();
    ctx.moveTo(cx - deckW * 0.38, deckY);
    ctx.lineTo(cx + deckW * 0.38, deckY);
    ctx.lineTo(cx + deckW * 0.5, deckY + H * 0.045);
    ctx.lineTo(cx - deckW * 0.5, deckY + H * 0.045);
    ctx.closePath();
    var dg = ctx.createLinearGradient(0, deckY, 0, deckY + H * 0.05);
    dg.addColorStop(0, '#17131f'); dg.addColorStop(1, '#08070d');
    ctx.fillStyle = dg; ctx.fill();
    ctx.fillStyle = rgba(glow, 0.85);
    ctx.fillRect(cx - deckW * 0.5, deckY + H * 0.045 - 2, deckW, 2);

    // colourful front-of-stage light strip （台口灯带： blue/pink/yellow/green chasing)
    if(deckAmt > 0.02){
      var stripCols = [[110,170,255],[255,150,210],[255,215,110],[140,255,180]];
      var nDots = 16;
      for(var sd = 0; sd < nDots; sd++){
        var sx = cx - deckW * 0.47 + (sd / (nDots - 1)) * deckW * 0.94;
        var scol = stripCols[(sd + Math.floor(t * 2.2)) % 4];
        ctx.fillStyle = rgba(scol, 0.85 * deckAmt);
        ctx.beginPath(); ctx.arc(sx, deckY + H * 0.045 - 6, 2.1, 0, Math.PI * 2); ctx.fill();
      }
    }

    // runway （延伸台）: from the deck toward the audience, JJ20-style
    var runTopY = deckY + H * 0.045, runTipY = H * 0.705;
    var runTopHW = deckW * 0.16, runTipHW = deckW * 0.30;
    ctx.beginPath();
    ctx.moveTo(cx - runTopHW, runTopY);
    ctx.lineTo(cx + runTopHW, runTopY);
    ctx.lineTo(cx + runTipHW, runTipY);
    ctx.lineTo(cx - runTipHW, runTipY);
    ctx.closePath();
    var rg2 = ctx.createLinearGradient(0, runTopY, 0, runTipY);
    rg2.addColorStop(0, '#100d18'); rg2.addColorStop(1, '#1a1426');
    ctx.fillStyle = rg2; ctx.fill();
    // glowing runway edges + edge lights
    [-1, 1].forEach(function(side){
      ctx.strokeStyle = rgba(glow, 0.55);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(cx + side * runTopHW, runTopY);
      ctx.lineTo(cx + side * runTipHW, runTipY);
      ctx.stroke();
      for(var li = 0; li < 6; li++){
        var lk = li / 5;
        var lx = cx + side * lerp(runTopHW, runTipHW, lk);
        var ly = lerp(runTopY, runTipY, lk);
        var pulse = 0.5 + 0.5 * Math.sin(t * 2.4 * speed + li * 0.9 + (side > 0 ? 1 : 0));
        ctx.fillStyle = rgba(seaCols[0], 0.35 + 0.55 * pulse);
        ctx.beginPath(); ctx.arc(lx, ly, 1.6 + lk * 1.6, 0, Math.PI * 2); ctx.fill();
      }
    });
    // glowing ring at the runway tip
    ctx.beginPath();
    ctx.ellipse(cx, runTipY, runTipHW * 0.52, runTipHW * 0.16, 0, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(glow, 0.75); ctx.lineWidth = 2; ctx.stroke();

    // center spotlight cone onto the runway tip
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    beam(cx, scrY - 16, Math.PI + Math.sin(t * 0.5 * speed) * 0.05, runTipY - scrY + 6, 40, [255, 244, 214], 0.10 * (0.35 + 0.65 * dimNow));
    // floor beams crossing
    [-1, 1].forEach(function(side){
      var fx2 = cx + side * deckW * 0.44;
      var ang2 = -side * (0.6 + 0.18 * Math.sin(t * 0.8 * speed + (side > 0 ? 1.5 : 0)));
      beam(fx2, deckY + H * 0.03, ang2, H * 0.5, 22, beamCols[side > 0 ? 0 : 2], 0.08 * dimNow);
    });
    ctx.restore();

    // mic stand at the runway tip (the singer's spot) — swaps to the crystal piano in the request segment
    if(pianoAmt < 0.98){
      ctx.save();
      ctx.globalAlpha = 1 - pianoAmt;
      ctx.fillStyle = 'rgba(0,0,0,.88)';
      ctx.fillRect(cx - 1, runTipY - H * 0.050, 2, H * 0.050);
      ctx.beginPath(); ctx.arc(cx, runTipY - H * 0.054, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    if(pianoAmt > 0.02){
      ctx.save();
      ctx.globalAlpha = pianoAmt;
      var pg = ctx.createRadialGradient(cx, runTipY, 2, cx, runTipY, 52);
      pg.addColorStop(0, 'rgba(190,210,255,.34)'); pg.addColorStop(1, 'rgba(190,210,255,0)');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.ellipse(cx, runTipY, 56, 15, 0, 0, Math.PI * 2); ctx.fill();
      // grand piano silhouette: open lid + body + keys
      ctx.fillStyle = '#04040a';
      ctx.beginPath();
      ctx.moveTo(cx - 18, runTipY - 12);
      ctx.lineTo(cx + 12, runTipY - 27);
      ctx.lineTo(cx + 17, runTipY - 12);
      ctx.closePath(); ctx.fill();
      rr(cx - 18, runTipY - 13, 36, 7, 3); ctx.fill();
      ctx.fillStyle = 'rgba(238,243,255,.92)';
      rr(cx - 16, runTipY - 11.4, 32, 2.2, 1); ctx.fill();
      ctx.fillStyle = '#04040a';
      ctx.fillRect(cx - 14, runTipY - 6, 2.6, 6);
      ctx.fillRect(cx + 12, runTipY - 6, 2.6, 6);
      ctx.restore();
    }

    // ---------------- light sea ----------------
    var seaGrad = ctx.createLinearGradient(0, H * 0.72, 0, H);
    seaGrad.addColorStop(0, 'rgba(4,3,10,0)');
    seaGrad.addColorStop(0.25, 'rgba(4,3,10,.55)');
    seaGrad.addColorStop(1, 'rgba(2,2,6,.96)');
    ctx.fillStyle = seaGrad; ctx.fillRect(0, H * 0.72, W, H * 0.28);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(var i = 0; i < sea.length; i++){
      var d = sea[i];
      var wave = Math.sin(d.x * 0.012 - t * 2.2 * speed + d.r * 0.35);
      var tw = 0.55 + 0.45 * Math.sin(t * (1.4 + d.s) + d.ph);
      var b = (0.35 + 0.65 * Math.max(0, wave) * waveAmp + 0.25) * tw * (0.35 + 0.65 * dimNow);
      var col = seaCols[d.ci];
      var size = (1.5 + d.r * 0.55) * d.s;
      var bob = waveAmp * wave * (1.2 + d.r * 0.5);
      ctx.fillStyle = rgba(col, Math.min(1, b));
      ctx.beginPath();
      ctx.arc(d.x, d.y + bob, size, 0, Math.PI * 2);
      ctx.fill();
      if(b > 0.75){
        ctx.fillStyle = rgba(col, (b - 0.75) * 0.8);
        ctx.beginPath(); ctx.arc(d.x, d.y + bob, size * 3.1, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();

    // rain for jiangnan
    if(modeKey === 'jiangnan'){
      ctx.strokeStyle = 'rgba(170,200,255,.20)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for(var rn = 0; rn < 60; rn++){
        var rx = ((rn * 173.3 + t * 260) % (W + 60)) - 30;
        var ry = ((rn * 97.7 + t * 520) % (H * 0.7));
        ctx.moveTo(rx, ry); ctx.lineTo(rx - 3, ry + 13);
      }
      ctx.stroke();
    }

    // haze
    var hz = ctx.createRadialGradient(cx + Math.sin(t * 0.13) * 60, H * 0.42, 10, cx, H * 0.42, W * 0.55);
    hz.addColorStop(0, rgba(glow, 0.06)); hz.addColorStop(1, rgba(glow, 0));
    ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H);

    // confetti update
    if(confetti.length){
      for(var ci2 = confetti.length - 1; ci2 >= 0; ci2--){
        var p = confetti[ci2];
        p.y += p.vy; p.x += p.vx + Math.sin(t * 3 + p.rot) * 0.5; p.rot += p.vr;
        if(p.y > H + 24){ confetti.splice(ci2, 1); continue; }
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = rgba(p.c, 0.92);
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.4 + 0.6 * Math.abs(Math.sin(t * 4 + p.rot * 3))));
        ctx.restore();
      }
    }

    requestAnimationFrame(frame);
  }

  /* ---------------- controls ---------------- */
  var nowTitle = document.getElementById('nowTitle');
  var nowSub = document.getElementById('nowSub');
  var LABELS = {
    open: ['开场 · JJ20', '紫海升起，激光交织——南宁那晚，全场还自发玩起了人浪'],
    jiangnan: ['江南', '蓝调灯光 + 屏幕细雨'],
    millennium: ['一千年以后', '金色光束 · 全场大合唱的前奏'],
    tasay: ['她说', '粉白色慢光 · 安静的一首'],
    request: ['点歌环节', '暗场 + 水晶钢琴——南宁的帖子里，点到的是《翅膀》和《害怕》'],
    story: ['将故事写成我们', '终幕：大屏亮出她在 JJ20 的照片 · 紫海全开']
  };
  var btns = document.querySelectorAll('#btns button[data-mode]');
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.dataset.mode;
      if(k === modeKey) return;
      from = snapshot(); to = MODES[k]; modeKey = k; transT = 0;
      cur = to;
      btns.forEach(function(x){ x.classList.toggle('on', x === b); });
      nowTitle.textContent = LABELS[k][0];
      nowSub.textContent = LABELS[k][1];
      if(k === 'story') setTimeout(function(){ burst(150); }, 450);
    });
  });
  function snapshot(){
    return {
      beam: mix('beam'), sea: mix('sea'), scrA: mix('scrA'), scrB: mix('scrB'),
      glow: mix('glow'), speed: mixNum('speed'), wave: mixNum('wave'), dim: mixNum('dim'),
      title: to.title, sub: to.sub
    };
  }
  document.getElementById('confettiBtn').addEventListener('click', function(){ burst(130); });

  resize();
  requestAnimationFrame(frame);
})();
</script>
